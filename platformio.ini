[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
; After each build, copy the flashable images to bin/ (see bin/flash.sh).
extra_scripts = post:tools/copy_to_bin.py
; XPT2046 touch controller (separate SPI bus on the CYD: CLK25 MOSI32 MISO39 CS33).
lib_deps =
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
; TFT_eSPI v2.5.33 is vendored in lib/ from the official tagged release.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=10000000
    -D SPI_READ_FREQUENCY=1000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
